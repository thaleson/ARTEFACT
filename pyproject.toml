[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-agent"
version = "0.1.0"
description = "Text support agent for the Empório da Música technical challenge"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.40,<2",
    "PyMuPDF>=1.24,<2",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]
frontend = [
    "httpx>=0.27,<1",
    "streamlit>=1.38,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
