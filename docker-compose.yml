services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENT_MODE: ${AGENT_MODE:-offline}
      DATA_DIR: /app/data/raw
      DATABASE_PATH: /app/data/app.db
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
